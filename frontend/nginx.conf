server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The wasm binary and JS glue compress very well.
    gzip on;
    gzip_types application/wasm application/javascript text/css text/html;
    gzip_min_length 1024;

    # Client-side routing: anything that is not a file falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend calls /api/* and the OAuth flow lives under /auth/*, both on
    # the same origin, so forward them to the backend service in compose.
    # A variable in proxy_pass forces runtime DNS resolution via Docker's
    # embedded resolver, so nginx still starts when the backend is restarting.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
