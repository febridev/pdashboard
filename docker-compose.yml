# Personal dashboard: Axum backend + React/Vite frontend served by nginx.
# Before `docker compose up`: create a .env in this directory from
# backend/.env.example with real secrets (never committed).
# The frontend proxies /api/* and /auth/* to the backend, so the browser only
# needs http://<vps>:8081; set GOOGLE_REDIRECT_URI accordingly, e.g.
# http://<vps>:8081/auth/google/callback.

services:
  backend:
    build: ./backend
    ports:
      - "3001:3000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
